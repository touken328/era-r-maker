<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📙 R 액션/리액션 메이커</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style_maker.css">
<script src="js_maker.js"></script>
</head>
<!-- era_Maker_Act.html -->
<body data-page="act">

<div class="header">
  <h1>📙 Era R 액션/리액션 메이커 [Act]</h1>
  <label class="chk"><input type="checkbox" id="withHeader" checked> 출력에 <code>[액션]</code> / <code>[리액션]</code> 구분자 포함</label>
  <nav class="header-nav">
    <a href="era_Readme.html" data-nav="readme">도움말</a>
    <a href="Csv.html" data-nav="csv">CSV 생성</a>
    <a href="era_Maker_Set.html"   data-nav="set">기본 세팅</a>
    <a href="era_Maker_Act.html"   data-nav="act">조교 액션</a>
    <a href="era_Maker_Event.html" data-nav="event">조교 이벤트</a>
    <a href="era_Maker_Talk.html"  data-nav="talk">대화 구상</a>
  </nav>
</div>

<div class="main-container">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-tabs">
        <button id="btnTabStr" class="tab-btn active" type="button">조교 행동</button>
        <button id="btnTabTrain" class="tab-btn" type="button">리액션/답변</button>
      </div>
    </div>
    <iframe id="sidebarFrame" class="sidebar-frame" src="side/side_Str.html"></iframe>
    <div class="sidebar-fallback" id="strFallback" style="display:none;">
      파일을 불러오지 못했습니다.<br>
      같은 폴더에 <b>side_Str.html</b> 또는 <b>side_Train.html</b> 파일이 있는지 확인해 주세요.
    </div>
  </div>

  <div class="editor-wrap">
    <p class="hint">번호(1. 2.)를 적으면 분기가 자동 생성됩니다. 호감도/답변은 <code>1.[숫자]</code> 형식으로 적어주세요.</p>
    <div class="editor-inner">
      <div id="sets"></div>
      <div class="add-btn-wrap">
        <button id="addBtn" class="primary" type="button">+ 세트 추가</button>
      </div>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="preview-header">
      <span>출력 결과 프리뷰</span>
      <span class="status" id="previewStatus">대기 중</span>
    </div>
    <pre id="preview">(출력 결과가 여기에 표시됩니다)</pre>
  </div>
</div>

<div class="toolbar">
  <span id="totalCharsDisplay" class="total-chars">총 글자수 : 0 자</span>
  캐릭터번호<input type="text" id="globalCharId" class="charId-input" placeholder="K번호" autocomplete="off">
  <button id="outBtn" class="primary" type="button">출력</button>
  <button id="saveErbBtn" type="button">.ERB 저장</button>
  <button id="copyBtn" type="button">복사</button>
  <div class="spacer"></div>
  <button id="clearBtn" type="button" class="del">전체 초기화</button>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'era_editor_v2';
  const CHAR_ID_KEY = 'era_editor_char_id';

  const setsEl = document.getElementById('sets');
  const previewEl = document.getElementById('preview');
  const withHeaderEl = document.getElementById('withHeader');
  const previewStatus = document.getElementById('previewStatus');
  const globalCharId = document.getElementById('globalCharId');

  // 공통 유틸 참조
  const { transformText, parseBlocks, getContentCharCount } = window.EraCommon;

  /* ---------------- 글자수 갱신 ---------------- */
  function updateCharCounts() {
    let total = 0;
    document.querySelectorAll('.set').forEach(el => {
      const actText = el.querySelector('.actContent').value;
      const reText  = el.querySelector('.reactContent').value;
      const c = getContentCharCount(actText) + getContentCharCount(reText);
      const badge = el.querySelector('.set-char-count');
      if (badge) badge.textContent = c.toLocaleString() + ' 자';
      total += c;
    });
    const totalEl = document.getElementById('totalCharsDisplay');
    if (totalEl) totalEl.textContent = '총 글자수 : ' + total.toLocaleString() + ' 자';
  }
  /* ---------------- 코드 생성 ---------------- */
  function makeBlock(funcName, text, funcType, isReaction) {
    const out = [];
    out.push('@' + funcName);

    let transformedText = text;
    if (!/PRINTFORM[LW]|PRINTFORMD[LW]/.test(text)) {
      transformedText = transformText(text);
    }

    const blocks = parseBlocks(transformedText);

    if (blocks.length === 0) {
      out.push('LOCAL = 0');
      return out.join('\n');
    }

    out.push('LOCAL = 1');
    out.push('IF LOCAL');

    if (funcType === 'favor' || (funcType === 'selectcom' && isReaction)) {
      const bracketed = blocks.filter(b => b.bracketNums && b.bracketNums.length > 0);
      const unbracketed = blocks.filter(b => !b.bracketNums || b.bracketNums.length === 0);

      if (bracketed.length > 0) {
        bracketed.forEach((b, idx) => {
          let condStr = '';
          if (funcType === 'favor') {
            // 호감도일 경우: 배열 내의 모든 숫자에 대해 OR 조건 생성 (예: FAVOR(10) || FAVOR(20))
            condStr = b.bracketNums.map(n => `FAVOR(${n})`).join(' || ');
          } else {
            // 답변일 경우: 배열 내의 모든 숫자에 대해 OR 조건 생성 (예: SELECTCOM == 3 || SELECTCOM == 8)
            condStr = b.bracketNums.map(n => `SELECTCOM == ${n}`).join(' || ');
          }
          
          out.push(`\t${idx === 0 ? 'IF' : 'ELSEIF'} ${condStr}`);
          b.lines.forEach(l => out.push('\t\t' + l));
        });

        if (unbracketed.length > 0) {
          out.push('\tELSE');
          unbracketed.forEach(b => {
            b.lines.forEach(l => out.push('\t\t' + l));
          });
        }
        out.push('\tENDIF');
      } else {
        unbracketed.forEach(b => {
          b.lines.forEach(l => out.push('\t\t' + l));
        });
      }
    } else {
      // 기존 랜덤 모드 로직 유지
      const maxNum = blocks[blocks.length - 1].num;
      const n = maxNum > 0 ? maxNum : 0;

      if (n <= 1) {
        const b = blocks[0];
        b.lines.forEach(l => out.push('\t' + l));
      } else {
        for (let i = 0; i < n; i++) {
          const b = blocks.find(x => x.num === i + 1) || { lines: ['PRINTFORMDW (내용 없음)'] };
          if (i === n - 1) {
            out.push('\tELSE');
          } else {
            out.push('\t' + (i === 0 ? 'IF' : 'ELSEIF') + ' !RAND:' + (n - i));
          }
          b.lines.forEach(l => out.push('\t\t' + l));
        }
        out.push('\tENDIF');
      }
    }

    out.push('\tRETURN 1');
    out.push('ENDIF');
    return out.join('\n');
  }

  // ★ [추가] 누락된 generate 함수 복구
  function generate() {
    const withHeader = withHeaderEl.checked;
    const parts = [];
    const charId = globalCharId.value.trim() || '0';

    document.querySelectorAll('.set').forEach(el => {
      const actFuncType = el.querySelector('.actFuncType').value;
      const reactFuncType = el.querySelector('.reactFuncType').value;
      const actId   = el.querySelector('.actId').value.trim();

      let actText = el.querySelector('.actContent').value;
      let reText  = el.querySelector('.reactContent').value;

      let s = '';
      if (withHeader) s += ';───────────\n; ■ 조교 액션 ACT ' + actId + '\n;───────────\n';
      s += makeBlock('KOJO_ACT_K' + charId + '_' + actId, actText, actFuncType, false);
      s += '\n\n';
      if (withHeader) s += ';───────────\n; □ 리액션 발생 REACT ' + actId + '\n;───────────\n';
      s += makeBlock('KOJO_REACT_K' + charId + '_' + actId, reText, reactFuncType, true);

      parts.push(s);
    });

    return parts.join('\n\n');
  }
  /* ---------------- 검증 ---------------- */
  function validate() {
    const warns = [];
    let idx = 0;

    document.querySelectorAll('.set').forEach(el => {
      idx++;
      const actFuncType = el.querySelector('.actFuncType').value;
      const reactFuncType = el.querySelector('.reactFuncType').value;
      const actId  = el.querySelector('.actId').value.trim();

      if (!actId) warns.push('세트 ' + idx + ': 행동 지정번호가 비어 있습니다.');

      const items = [
        { name: '액션',   ta: el.querySelector('.actContent'), isReaction: false, funcType: actFuncType },
        { name: '리액션', ta: el.querySelector('.reactContent'), isReaction: true, funcType: reactFuncType }
      ];

      items.forEach(it => {
        let text = it.ta.value;
        if (!/PRINTFORM[LW]|PRINTFORMD[LW]/.test(text)) {
          text = transformText(text);
        }
        const blocks = parseBlocks(text);
        if (blocks.length === 0) return;

        blocks.forEach((b, i) => {
          if (b.num !== i + 1) {
            warns.push(`세트 ${idx} ${it.name}: ${i + 1}번째 블록의 번호가 ${b.num}. 입니다. ("${i + 1}." 이어야 합니다.)`);
          }
        });

        // 배열(bracketNums)을 순회하며 유효성 검사
        if (it.funcType === 'favor') {
          blocks.forEach(b => {
            b.bracketNums.forEach(n => {
              if (n < 0) {
                warns.push(`세트 ${idx} ${it.name}: 호감도 값(${n})이 음수입니다. (0 이상이어야 합니다.)`);
              }
            });
          });
        } else if (it.funcType === 'selectcom') {
          blocks.forEach(b => {
            b.bracketNums.forEach(n => {
              if (n < 0 || n > 77) {
                warns.push(`세트 ${idx} ${it.name}: 답변 값(${n})이 범위를 벗어났습니다. (0~77 사이여야 합니다.)`);
              }
            });
          });
        }
      });
    });

    return warns;
  }
  /* ---------------- UI ---------------- */
  function createSet(data) {
    data = data || {};
    const el = document.createElement('div');
    el.className = 'set';

    let actType = data.actFuncType || data.funcType || 'random';
    let reactType = data.reactFuncType || data.funcType || 'random';
    if (actType === 'selectcom') actType = 'random';

    el.innerHTML =
      '<div class="set-head">' +
        '<div class="set-title-wrap">' +
          '<span class="set-title">세트</span>' +
          '<span class="set-char-count">0 자</span>' +
        '</div>' +
        '<button class="del" type="button">삭제</button>' +
      '</div>' +
      '<div class="grid grid-3">' +
        '<label>조교 행동 번호<input type="text" class="actId" autocomplete="off"></label>' +
        '<label>액션 분기 방식<select class="actFuncType">' +
          '<option value="random">미지정/랜덤</option>' +
          '<option value="favor">호감도 : [nnn]이상</option>' +
        '</select></label>' +
        '<label>리액션 분기 방식<select class="reactFuncType">' +
          '<option value="random">미지정/랜덤</option>' +
          '<option value="favor">호감도 : [nnn]이상</option>' +
          '<option value="selectcom">답변 : [n] 선택시</option>' +
        '</select></label>' +
      '</div>' +
      '<label>액션 내용 (번호 작성시 분기 발생)<textarea class="actContent" rows="6" spellcheck="false"></textarea></label>' +
      '<label>리액션 내용 (번호 작성시 분기 발생)<textarea class="reactContent" rows="6" spellcheck="false"></textarea></label>';

    el.querySelector('.actFuncType').value   = actType;
    el.querySelector('.reactFuncType').value = reactType;
    el.querySelector('.actId').value         = data.actId || '';
    el.querySelector('.actContent').value    = data.actContent || '';
    el.querySelector('.reactContent').value  = data.reactContent || '';

    el.querySelector('.del').addEventListener('click', () => {
      el.remove();
      if (!document.querySelector('.set')) createSet();
      renumber();
      persist();
      updateCharCounts();
    });

    setsEl.appendChild(el);
    renumber();
    updateCharCounts();
    return el;
  }

  function renumber() {
    document.querySelectorAll('.set').forEach((el, i) => {
      el.querySelector('.set-title').textContent = '세트 ' + (i + 1);
    });
  }

  function persist() {
    const data = [];
    document.querySelectorAll('.set').forEach(el => {
      data.push({
        actFuncType:   el.querySelector('.actFuncType').value,
        reactFuncType: el.querySelector('.reactFuncType').value,
        actId:         el.querySelector('.actId').value,
        actContent:    el.querySelector('.actContent').value,
        reactContent:  el.querySelector('.reactContent').value
      });
    });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      localStorage.setItem(CHAR_ID_KEY, globalCharId.value);
    } catch (e) {}
  }

  function restore() {
    try {
      const savedCharId = localStorage.getItem(CHAR_ID_KEY);
      if (savedCharId) globalCharId.value = savedCharId;

      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!Array.isArray(data) || data.length === 0) return false;
      data.forEach(d => createSet(d));
      return true;
    } catch (e) { return false; }
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    let newActId = '';
    const allSets = document.querySelectorAll('.set');
    if (allSets.length > 0) {
      const lastSet = allSets[allSets.length - 1];
      const lastActId = lastSet.querySelector('.actId').value.trim();
      if (/^\d+$/.test(lastActId)) {
        newActId = String(parseInt(lastActId, 10) + 1);
      }
    }
    const el = createSet({ actId: newActId });
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.querySelector('.actId').focus();
    persist();
    updateCharCounts();
  });

  document.getElementById('outBtn').addEventListener('click', () => {
    const warns = validate();
    if (warns.length) {
      const msg = '⚠ 다음 항목을 확인하세요.\n\n' + warns.join('\n') + '\n\n그래도 출력할까요?';
      if (!confirm(msg)) return;
    }
    const result = generate();
    previewEl.textContent = result.trim() ? result : '(출력할 내용이 없습니다)';
    previewStatus.textContent = '출력 완료';
    persist();
  });

  document.getElementById('saveErbBtn').addEventListener('click', () => {
    const text = previewEl.textContent;
    if (!text || text === '(출력 결과가 여기에 표시됩니다)' || text === '(출력할 내용이 없습니다)') {
      alert('먼저 [출력] 버튼을 눌러주세요.');
      return;
    }
    const charId = globalCharId.value.trim();
    if (!charId) {
      alert('하단 툴바의 캐릭터 지정번호가 비어 있습니다.');
      return;
    }

    const baseName = 'KOJO_ACT_K' + charId;
    const ext = '.ERB';

    let savedFiles = [];
    try { savedFiles = JSON.parse(localStorage.getItem(SAVED_FILES_KEY) || '[]'); } catch (e) {}

    let finalName = baseName + ext;
    let counter = 1;
    while (savedFiles.includes(finalName)) {
      finalName = baseName + '_' + counter + ext;
      counter++;
    }
    savedFiles.push(finalName);
    try { localStorage.setItem(SAVED_FILES_KEY, JSON.stringify(savedFiles)); } catch (e) {}

    const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = finalName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const text = previewEl.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('copyBtn');
      const old = btn.textContent;
      btn.textContent = '복사됨!';
      setTimeout(() => { btn.textContent = old; }, 1200);
    } catch (e) {
      alert('복사에 실패했습니다. 미리보기 영역을 직접 선택해 복사해 주세요.');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('모든 세트를 삭제하고 초기화할까요?')) return;
    setsEl.innerHTML = '';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    createSet();
    previewEl.textContent = '(출력 결과가 여기에 표시됩니다)';
    previewStatus.textContent = '대기 중';
    updateCharCounts();
  });

  document.addEventListener('input', e => {
    if (e.target.closest('.set') || e.target === globalCharId) {
      persist();
      updateCharCounts();
    }
  });

  /* ---------------- 사이드바 iframe ---------------- */
  const sidebarFrame = document.getElementById('sidebarFrame');
  const strFallback = document.getElementById('strFallback');
  const btnTabStr = document.getElementById('btnTabStr');
  const btnTabTrain = document.getElementById('btnTabTrain');

  function loadSidebarPage(pageName) {
    sidebarFrame.src = pageName + '?t=' + Date.now();
    if (pageName === 'side_Str.html') {
      btnTabStr.classList.add('active');
      btnTabTrain.classList.remove('active');
    } else {
      btnTabTrain.classList.add('active');
      btnTabStr.classList.remove('active');
    }
  }

  sidebarFrame.addEventListener('load', () => {
    strFallback.style.display = 'none';
  });
  sidebarFrame.addEventListener('error', () => {
    strFallback.style.display = 'block';
  });

  btnTabStr.addEventListener('click', () => loadSidebarPage('side_Str.html'));
  btnTabTrain.addEventListener('click', () => loadSidebarPage('side_Train.html'));

  /* ---------------- 시작 ---------------- */
  if (!restore()) createSet();
  updateCharCounts();
  
  window.EraCommon.initHeaderNav('act');
  
})();
</script>
</body>
</html>
